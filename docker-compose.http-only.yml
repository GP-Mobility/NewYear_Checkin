# Docker Compose for HTTP-only mode (Development)
# Usage: docker-compose -f docker-compose.yml -f docker-compose.http-only.yml up -d

version: '3.8'

services:
  nginx:
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/http-only.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/logs:/var/log/nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # Remove HTTPS port for HTTP-only mode
      # - "${NGINX_HTTPS_PORT:-443}:443"

